# ============================================================
# setup.cfg — flake8 / mypy / coverage 配置
# ============================================================
# 上下文层：被多个开发工具读取，按 INI 格式分节。

[flake8]
# F824: unused nonlocal, W503/W504: 二元运算符换行规则冲突
ignore = F824, W503, W504
max-line-length = 120
exclude =
    .git,
    .eggs,
    __pycache__,
    doc/examples

[mypy]
warn_unused_ignores = True               # 无用的 type: ignore 会警告
warn_redundant_casts = True              # 冗余类型转换会警告
ignore_missing_imports = True            # 第三方库缺 stub 不报错

[coverage:run]
parallel = 1                              # 多进程模式
concurrency = multiprocessing,thread
disable_warnings = no-data-collected
source =
    backtesting
    doc/examples
omit =

[coverage:report]
# 以下模式的行不计入覆盖率
exclude_lines =
    ^\s*continue\b
    ^\s*return\b
    ^\s*raise\b
    ^\s*except\b
    ^\s*warnings\.warn\(
    ^\s*warn\(
