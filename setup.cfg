# ============================================================
# setup.cfg — setuptools 辅助配置文件
# 上下文层：被 pip / setuptools / flake8 / mypy / coverage 等工具读取。
#           与本项目相关的工具有：
#           1. flake8 —— Python 代码风格检查（已被 ruff 部分替代）
#           2. mypy —— 静态类型检查
#           3. coverage —— 测试覆盖率统计
# 设计层：INI 格式，每个 [section] 对应一个工具的配置。
# ============================================================

# --- flake8 代码风格检查配置 ---
# 上下文层：flake8 是 Python 社区经典的 lint 工具。
#           本项目同时配置了 ruff（pyproject.toml）和 flake8（本文件），
#           flake8 配置作为传统兼容保留。
[flake8]

# 功能层：忽略的 flake8 规则
#   F824: "nonlocal x" is unused: name is never assigned in scope
#   W503: Line break before a binary operator
#   W504: Line break after a binary operator -- https://www.flake8rules.com/rules/W504.html
ignore = F824, W503, W504

# 功能层：每行最大字符数限制
max-line-length = 120

# 功能层：排除不需要检查的目录
exclude =
    .git,
    .eggs,
    __pycache__,
    doc/examples

# --- mypy 静态类型检查配置 ---
# 上下文层：mypy 检查 Python 类型注解的正确性。
#           本项目使用类型注解提升代码可读性，但不强制完整覆盖。
[mypy]

# 功能层：对未使用的类型忽略注释发出警告
warn_unused_ignores = True

# 功能层：对冗余的类型转换发出警告
warn_redundant_casts = True

# 功能层：忽略第三方库缺少类型存根（stub）的导入
#         原因：numpy、pandas、bokeh 等库的类型提示不完整
ignore_missing_imports = True

# --- coverage.py 测试覆盖率配置 ---
# 上下文层：coverage.py 统计测试运行时覆盖了哪些代码行。
#           本课程不仅以测试通过为目标，但保留覆盖率配置供参考。
[coverage:run]

# 功能层：启用并行模式（多个测试进程时可以合并覆盖率数据）
parallel = 1

# 功能层：使用 multiprocessing 和 threading 的并发覆盖支持
concurrency = multiprocessing,thread

# 功能层：抑制"没有收集到数据"的警告
disable_warnings = no-data-collected

# 功能层：覆盖率统计的目标源码目录
source =
    backtesting
    doc/examples

# 功能层：排除的文件（空，不排除任何源文件）
omit =

[coverage:report]

# 功能层：在覆盖率报告中排除的行模式
#         这些行通常不包含可执行逻辑（continue、raise、except、warning 等）
exclude_lines =
    ^\s*continue\b
    ^\s*return\b
    ^\s*raise\b
    ^\s*except\b
    ^\s*warnings\.warn\(
    ^\s*warn\(
