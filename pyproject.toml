# ============================================================
# pyproject.toml — 项目元数据与工具配置（PEP 518/621）
# 上下文层：Python 生态的标准项目配置文件，被 pip、build、
#           ruff、mypy 等工具读取。本文件中主要配置 ruff linter。
# 设计层：TOML 格式（Tom's Obvious, Minimal Language），
#          比 setup.cfg 的 INI 格式表达力更强，是 Python 社区的新标准。
# ============================================================

# --- ruff 代码检查工具配置 ---
# 上下文层：ruff 是用 Rust 编写的快速 Python linter/formatter，
#          在本项目中替代 flake8 + isort 等多工具的职责。
[tool.ruff]

# 功能层：排除不需要检查的目录
exclude = [
    '.git',          # Git 仓库元数据
    '.eggs',         # setuptools 构建临时目录
    '__pycache__',   # Python 字节码缓存
    'doc/examples',  # 文档示例代码（已从课程分支删除）
]

# 功能层：忽略的 lint 规则及其原因
ignore = [
    'UP006',   # 允许使用 typing.Optional 等旧式类型注解
    'UP007',   # 允许使用 typing.Union 而非 X | Y 语法
    'UP009',   # 允许使用 # type: ignore 注释
    'N802',    # 允许函数名使用大写字母（如 Strategy.I）
    'N806',    # 允许变量名使用大写字母（如 GOOG 常量）
    'C901',    # 允许函数/方法复杂度较高（回测引擎逻辑复杂）
    'B008',    # 允许在函数参数默认值中直接调用函数
    'B011',    # 允许 assert False 的写法
    'RUF002',  # 允许文档字符串中使用模糊的 ruff 规则代码
]

# 功能层：每行最大字符数
line-length = 100

# 功能层：启用的 lint 规则集
select = [
    'I',     # isort：import 排序
    'E',     # pycodestyle：风格错误
    'F',     # pyflakes：逻辑错误检测
    'W',     # pycodestyle：风格警告
    'UP',    # pyupgrade：建议使用新版 Python 语法
    'N',     # pep8-naming：命名规范
    'C',     # mccabe：圈复杂度
    'B',     # flake8-bugbear：常见 bug 模式
    'T',     # flake8-print：print 语句检测
    'RUF',   # ruff 自有规则
    'YTT',   # flake8-2020：年份硬编码检测
]

# --- ruff 对 PEP 8 命名约定的特殊配置 ---
[tool.ruff.pep8-naming]
# 功能层：允许 `l`、`h` 作为变量名（常见数学/图形学缩写）
ignore-names = [
    'l',
    'h',
]