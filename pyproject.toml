# ============================================================
# pyproject.toml — ruff 代码检查配置
# ============================================================
# 上下文层：ruff 是用 Rust 写的快速 Python linter，替代 flake8 + isort。

[tool.ruff]
exclude = [
    '.git',
    '.eggs',
    '__pycache__',
    'doc/examples',
]

# 忽略的规则及原因
ignore = [
    'UP006',   # 不强制新版类型注解（允许 Optional 等旧写法）
    'UP007',   # 不强制 X | Y 替代 Union
    'UP009',   # 允许 # type: ignore
    'N802',    # 允许大写函数名（如 Strategy.I）
    'N806',    # 允许大写变量名
    'C901',    # 允许复杂函数（回测引擎本就复杂）
    'B008',    # 允许参数默认值中直接调用
    'B011',    # 允许 assert False
    'RUF002',  # 允许 docstring 中的模糊规则编号
]

line-length = 100

select = [
    'I',     # import 排序
    'E',     # 风格错误
    'F',     # 逻辑错误
    'W',     # 风格警告
    'UP',    # 建议升级语法
    'N',     # 命名规范
    'C',     # 圈复杂度
    'B',     # 常见 bug
    'T',     # print 检测
    'RUF',   # ruff 自有规则
    'YTT',   # 年份硬编码
]

[tool.ruff.pep8-naming]
# l 和 h 作为变量名允许（数学/图形学常见）
ignore-names = ['l', 'h']
